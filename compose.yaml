name: file-integrity-lab
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integrity
      POSTGRES_USER: integrity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrity -d integrity"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: integrity
      DB_USER: integrity
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /data
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-26214400}
      APP_API_KEY: ${APP_API_KEY:-}
      OS_AUTH_URL: ${OS_AUTH_URL:-}
      OS_APPLICATION_CREDENTIAL_ID: ${OS_APPLICATION_CREDENTIAL_ID:-}
      OS_APPLICATION_CREDENTIAL_SECRET: ${OS_APPLICATION_CREDENTIAL_SECRET:-}
      OS_REGION_NAME: ${OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${OS_INTERFACE:-internal}
      SWIFT_CONTAINER: ${SWIFT_CONTAINER:-file-integrity}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - file-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
  file-data:
