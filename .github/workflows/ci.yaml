name: Application CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  elasticity-checks:
    name: Offline Heat templates and TV3 tools
    runs-on: ubuntu-latest
    container: python:3.12-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tooling only
        run: pip install -r deploy/elasticity/requirements-check.txt requests==2.34.2
      - name: Check nested Heat references and tool behavior
        run: |
          python deploy/elasticity/validate.py
          python -m unittest discover -s deploy/elasticity/tests -v
  application-tests:
    name: Docker build and application tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Frontend HTTP and clipboard tests
        run: node --test tests/frontend/*.test.cjs
      - name: Build and start isolated local stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 180
      - name: Unit and adapter contract tests
        run: docker compose exec -T app python -m pytest tests -q -p no:cacheprovider
      - name: Offline Heat references and safety invariants
        run: docker compose exec -T app python deploy/elasticity/kit.py lint
      - name: Live PostgreSQL API and frontend smoke test
        run: docker compose exec -T app python tests/smoke_live.py
      - name: Load workload integrity scenarios with an isolated API
        run: docker compose exec -T app python tests/loadtest/smoke_workload.py
      - name: Locust CLI success and semantic failure checks
        run: docker compose exec -T app python tests/smoke_locust.py
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail 100
      - name: Clean up ephemeral CI stack
        if: always()
        run: docker compose down
