heat_template_version: '2018-08-31'
description: One private app VM and its pool member, removed together on scale-in.
parameters:
  image_id:
    type: string
  flavor_id:
    type: string
  network_id:
    type: string
  subnet_id:
    type: string
  security_group_id:
    type: string
  key_name:
    type: string
  availability_zone:
    type: string
  pool_id:
    type: string
  app_port:
    type: number
  metering_group:
    type: string
  bootstrap_user_data:
    type: string
    hidden: true
    description: Private cloud-init for a prebuilt app image; same Swift and PostgreSQL on every VM.
resources:
  port:
    type: OS::Neutron::Port
    properties:
      network: {get_param: network_id}
      fixed_ips:
        - subnet: {get_param: subnet_id}
      security_groups: [{get_param: security_group_id}]
  server:
    type: OS::Nova::Server
    properties:
      image: {get_param: image_id}
      flavor: {get_param: flavor_id}
      key_name: {get_param: key_name}
      availability_zone: {get_param: availability_zone}
      networks:
        - port: {get_resource: port}
      metadata:
        metering.server_group: {get_param: metering_group}
      config_drive: true
      user_data_format: RAW
      user_data: {get_param: bootstrap_user_data}
  member:
    type: OS::Octavia::PoolMember
    properties:
      pool: {get_param: pool_id}
      address: {get_attr: [port, fixed_ips, 0, ip_address]}
      protocol_port: {get_param: app_port}
      subnet: {get_param: subnet_id}
    depends_on: server
outputs:
  server_id:
    value: {get_resource: server}
  private_ip:
    value: {get_attr: [port, fixed_ips, 0, ip_address]}
