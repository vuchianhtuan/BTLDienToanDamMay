heat_template_version: '2018-08-31'
description: Private HTTP load balancer; no floating IP or application VM is created.
parameters:
  subnet_id:
    type: string
  provider:
    type: string
    default: amphora
  app_port:
    type: number
    default: 8000
    constraints:
      - range: {min: 1, max: 65535}
resources:
  lb:
    type: OS::Octavia::LoadBalancer
    properties:
      vip_subnet: {get_param: subnet_id}
      provider: {get_param: provider}
  listener:
    type: OS::Octavia::Listener
    properties:
      loadbalancer: {get_resource: lb}
      protocol: HTTP
      protocol_port: 80
  pool:
    type: OS::Octavia::Pool
    properties:
      listener: {get_resource: listener}
      protocol: HTTP
      lb_algorithm: ROUND_ROBIN
  monitor:
    type: OS::Octavia::HealthMonitor
    properties:
      pool: {get_resource: pool}
      type: HTTP
      http_method: GET
      url_path: /health/ready
      expected_codes: '200'
      delay: 10
      timeout: 5
      max_retries: 3
outputs:
  loadbalancer_id:
    value: {get_resource: lb}
  pool_id:
    value: {get_resource: pool}
  vip_address:
    value: {get_attr: [lb, vip_address]}
