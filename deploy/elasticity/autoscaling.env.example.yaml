# Copy to private/autoscaling.env.yaml. These are examples, NOT measured thresholds.
parameters:
  image_id: CHANGE_ME_PREBUILT_APP_IMAGE_UUID
  flavor_id: CHANGE_ME_FLAVOR_UUID
  network_id: CHANGE_ME_PRIVATE_NETWORK_UUID
  subnet_id: CHANGE_ME_PRIVATE_SUBNET_UUID
  security_group_id: CHANGE_ME_APP_SECURITY_GROUP_UUID
  key_name: CHANGE_ME_KEYPAIR
  az_a: CHANGE_ME_AZ_1
  az_b: CHANGE_ME_AZ_2
  provider: amphora
  app_port: 8000
  # bootstrap_user_data is passed with --parameter-file, never inline on the CLI.
  # Example ONLY for a 1-vCPU flavor and cpu (cumulative nanoseconds).
  # rate:mean is nanoseconds/second: 700000000 = 70% of ONE vCPU.
  # Use measured units, vCPU count, archive-policy granularity and aggregation.
  metric_name: cpu
  aggregation_method: rate:mean
  threshold_high: 700000000
  threshold_low: 200000000
  granularity: 60
  evaluation_periods: 3
  cooldown: 300
  alarms_enabled: false
