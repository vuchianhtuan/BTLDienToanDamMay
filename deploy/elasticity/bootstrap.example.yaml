#cloud-config
# PREBUILT IMAGE contract: Docker + Compose, checked-out app at /opt/file-integrity,
# and its built container image already present. No package install/git clone on boot.
# Copy to private/bootstrap.yaml and replace every placeholder. Never commit it.
write_files:
  - path: /opt/file-integrity/deploy/app.env
    owner: root:root
    permissions: '0600'
    content: |
      DATABASE_URL=postgresql+psycopg://integrity:CHANGE_ME@DB_PRIVATE_IP:5432/integrity
      APP_API_KEY=CHANGE_ME
      OS_AUTH_URL=http://CONTROLLER_PRIVATE_IP:5000/v3
      OS_APPLICATION_CREDENTIAL_ID=CHANGE_ME
      OS_APPLICATION_CREDENTIAL_SECRET=CHANGE_ME
      OS_REGION_NAME=RegionOne
      OS_INTERFACE=internal
      SWIFT_CONTAINER=file-integrity
      MAX_FILE_BYTES=26214400
runcmd:
  - [docker, compose, --project-directory, /opt/file-integrity/deploy, --env-file, /opt/file-integrity/deploy/app.env, -f, /opt/file-integrity/deploy/compose.openstack.yaml, up, -d, --no-build, --wait, --wait-timeout, '180']
